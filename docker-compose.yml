services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_TEMPLATE_ID=${RESEND_TEMPLATE_ID}
    env_file:
      - .env
    restart: unless-stopped
